<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="748" viewBox="0 0 1360 748" role="img" aria-labelledby="title description">
<title id="title">FLASH hybrid-key checkpoint: retain the GPU ciphertext</title>
<desc id="description">The conventional secure checkpoint decrypts GPU ciphertext inside the CPU TEE and encrypts it again under the checkpoint key. FLASH preserves GPU ciphertext and its IVs and tags, while wrapping CPU state and the source GPU key separately under the checkpoint key. PCIe and stored images carry encrypted data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#000000"/></marker></defs>
<rect width="1360" height="748" fill="#FFFFFF"/>
<text x="40" y="49" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#14191E" text-anchor="start">Keep GPU ciphertext. Remove repeated CPU crypto.</text>
<text x="40" y="82" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#46525D" text-anchor="start">The GPU already encrypts data before it crosses untrusted PCIe.</text>
<text x="40" y="139" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#A62E30" text-anchor="start">CONVENTIONAL SECURE CHECKPOINT</text>
<text x="40" y="185" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#14191E" text-anchor="start">GPU TEE</text>
<text x="354" y="185" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#46525D" text-anchor="middle">UNTRUSTED PCIe</text>
<text x="462" y="185" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#14191E" text-anchor="start">CPU TEE</text>
<text x="1036" y="185" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#14191E" text-anchor="start">ENCRYPTED IMAGE</text>
<rect x="40" y="202" width="214" height="136" rx="10" fill="#EAF1FA" stroke="#000000" stroke-width="1.8"/>
<text x="147" y="238" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#14191E" text-anchor="middle">HBM state</text>
<line x1="71" y1="252" x2="223" y2="252" stroke="#000000" stroke-width="1.2"/>
<text x="147" y="282" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#14191E" text-anchor="middle">CE encrypts</text>
<text x="147" y="312" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="400" fill="#14191E" text-anchor="middle">K_D2H</text>
<line x1="254" y1="270" x2="456" y2="270" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="245" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14191E" text-anchor="middle">GPU ciphertext</text>
<text x="355" y="302" font-family="'SFMono-Regular',Consolas,monospace" font-size="18" font-weight="400" fill="#46525D" text-anchor="middle">K_D2H</text>
<rect x="462" y="202" width="494" height="136" rx="10" fill="#E9F6F2" stroke="#000000" stroke-width="1.8"/>
<rect x="481" y="224" width="197" height="89" rx="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
<text x="579.5" y="257" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#14191E" text-anchor="middle">Decrypt</text>
<text x="579.5" y="290" font-family="'SFMono-Regular',Consolas,monospace" font-size="20" font-weight="400" fill="#14191E" text-anchor="middle">K_D2H</text>
<line x1="678" y1="269" x2="726" y2="269" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="733" y="224" width="203" height="89" rx="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
<text x="834.5" y="257" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#14191E" text-anchor="middle">Encrypt</text>
<text x="834.5" y="290" font-family="'SFMono-Regular',Consolas,monospace" font-size="20" font-weight="400" fill="#14191E" text-anchor="middle">K_CKPT</text>
<line x1="956" y1="270" x2="1026" y2="270" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1036" y="202" width="284" height="136" rx="10" fill="#F5F6F8" stroke="#000000" stroke-width="1.8"/>
<text x="1178" y="249" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#14191E" text-anchor="middle">GPU + CPU state</text>
<text x="1178" y="289" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="400" fill="#14191E" text-anchor="middle">under K_CKPT</text>
<text x="709" y="369" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#A62E30" text-anchor="middle">Decrypt → encrypt, on every checkpoint</text>
<line x1="40" y1="401" x2="1320" y2="401" stroke="#000000" stroke-width="1.2"/>
<text x="40" y="446" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#08766C" text-anchor="start">FLASH HYBRID-KEY CHECKPOINT</text>
<text x="40" y="487" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#14191E" text-anchor="start">GPU TEE</text>
<text x="354" y="487" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#46525D" text-anchor="middle">UNTRUSTED PCIe</text>
<text x="462" y="487" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#14191E" text-anchor="start">CPU TEE</text>
<text x="1036" y="487" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#14191E" text-anchor="start">ENCRYPTED IMAGE</text>
<rect x="40" y="504" width="214" height="136" rx="10" fill="#EAF1FA" stroke="#000000" stroke-width="1.8"/>
<text x="147" y="540" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#14191E" text-anchor="middle">HBM state</text>
<line x1="71" y1="554" x2="223" y2="554" stroke="#000000" stroke-width="1.2"/>
<text x="147" y="584" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#14191E" text-anchor="middle">CE encrypts</text>
<text x="147" y="614" font-family="'SFMono-Regular',Consolas,monospace" font-size="21" font-weight="400" fill="#14191E" text-anchor="middle">K_D2H</text>
<line x1="254" y1="552" x2="456" y2="552" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="532" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14191E" text-anchor="middle">GPU ciphertext</text>
<text x="355" y="583" font-family="'SFMono-Regular',Consolas,monospace" font-size="18" font-weight="400" fill="#46525D" text-anchor="middle">K_D2H</text>
<rect x="462" y="504" width="494" height="154" rx="10" fill="#E9F6F2" stroke="#000000" stroke-width="1.8"/>
<text x="709" y="540" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#08766C" text-anchor="middle">Retain ciphertext + IVs + tags</text>
<line x1="485" y1="555" x2="1026" y2="555" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="481" y="580" width="455" height="58" rx="7" fill="#FFFFFF" stroke="#000000" stroke-width="1.8"/>
<text x="708.5" y="604" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#14191E" text-anchor="middle">CPU state + source K_D2H</text>
<text x="708.5" y="627" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#14191E" text-anchor="middle">wrap under K_CKPT</text>
<line x1="956" y1="611" x2="1026" y2="611" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1036" y="504" width="284" height="154" rx="10" fill="#F5F6F8" stroke="#000000" stroke-width="1.8"/>
<text x="1178" y="533" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#14191E" text-anchor="middle">GPU ciphertext</text>
<text x="1178" y="559" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#14191E" text-anchor="middle">under K_D2H · IVs · tags</text>
<line x1="1054" y1="575" x2="1302" y2="575" stroke="#000000" stroke-width="1.2"/>
<text x="1178" y="604" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#14191E" text-anchor="middle">CPU state + GPU key</text>
<text x="1178" y="633" font-family="'SFMono-Regular',Consolas,monospace" font-size="19" font-weight="400" fill="#14191E" text-anchor="middle">under K_CKPT</text>
<text x="40" y="710" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#14191E" text-anchor="start">GPU ciphertext is reused; CPU state and the source GPU key are protected separately.</text>
</svg>
